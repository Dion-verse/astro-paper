media:
  input: public/images/posts
  output: /images/posts

content:
  - name: posts
    label: Articles & Notes
    type: collection
    path: src/content/posts
    format: frontmatter
    view:
      fields: [title, pubDatetime, draft, featured]
      primary: title
    fields:
      - name: title
        label: Article Title
        type: string
        required: true
      - name: description
        label: Summary / Description
        type: string
        required: true
      - name: pubDatetime
        label: Published Date
        type: date
        required: true
      - name: modDatetime
        label: Last Modified Date
        type: date
      - name: author
        label: Author Name
        type: string
        default: Dawda Mbowe
      - name: tags
        label: Tags / Topics
        type: list
      - name: featured
        label: Feature on Homepage
        type: boolean
        default: false
      - name: draft
        label: Save as Draft
        type: boolean
        default: false
      - name: ogImage
        label: Custom Social / Header Image
        type: image
      - name: canonicalURL
        label: Canonical URL (Optional)
        type: string
      - name: timezone
        label: Time Zone (e.g. UTC, America/New_York)
        type: string
      - name: hideToc
        label: Hide Table of Contents
        type: boolean
        default: false
      - name: hideEditPost
        label: Hide Edit Post Link
        type: boolean
        default: false
      - name: body
        label: Article Body
        type: rich-text

  - name: pages
    label: Standalone Pages
    type: collection
    path: src/content/pages
    format: frontmatter
    view:
      fields: [title, description]
      primary: title
    fields:
      - name: title
        label: Page Title
        type: string
        required: true
      - name: description
        label: Meta Description
        type: string
      - name: canonicalURL
        label: Canonical URL (Optional)
        type: string
      - name: body
        label: Page Content
        type: rich-text
