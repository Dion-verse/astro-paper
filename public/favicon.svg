<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --bg: #F7F5EF;
      --fg: #24231F;
      --acc: #B65F49;
      --border: #DED9CF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191A18;
        --fg: #EEEAE2;
        --acc: #D58A70;
        --border: #373832;
      }
    }
    .bg-box { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
    .letter { fill: var(--fg); font-family: 'Charter', 'Georgia', serif; font-size: 20px; font-weight: 700; }
    .dot { fill: var(--acc); }
  </style>
  <rect class="bg-box" x="1" y="1" width="30" height="30" rx="6" />
  <text class="letter" x="8" y="23">F</text>
  <circle class="dot" cx="23" cy="22" r="2.5" />
</svg>
